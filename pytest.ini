[pytest]
testpaths = tests
pythonpath = .
markers =
    live: calls real APIs and uses quota (run with: pytest -m live)
# By default skip live tests: unit tests must be fast, free and work offline.
addopts = -m "not live"
# gr.Warning() outside a running app falls back to a Python warning; that's expected in tests.
filterwarnings =
    ignore::UserWarning:gradio.helpers
